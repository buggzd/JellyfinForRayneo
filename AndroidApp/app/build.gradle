plugins {
    id "com.android.application"
}

def repositoryRoot = rootProject.projectDir.parentFile
def versionPropertiesFile = new File(repositoryRoot, "version.properties")
if (!versionPropertiesFile.isFile()) {
    throw new GradleException("Missing version.properties at the repository root.")
}
def versionProperties = new Properties()
versionPropertiesFile.withInputStream { versionProperties.load(it) }
def appVersionName = versionProperties.getProperty("versionName", "").trim()
def appVersionCodeValue = versionProperties.getProperty("versionCode", "").trim()
if (!(appVersionName ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?/)) {
    throw new GradleException("versionName must be a SemVer release in version.properties.")
}
if (!(appVersionCodeValue ==~ /[1-9][0-9]*/)) {
    throw new GradleException("versionCode must be a positive integer in version.properties.")
}
def appVersionCode = Integer.parseInt(appVersionCodeValue)

def signingPropertiesFile = rootProject.file("keystore.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def environmentSigning = [
        path: System.getenv("ANDROID_KEYSTORE_PATH") ?: "",
        storePassword: System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "",
        keyAlias: System.getenv("ANDROID_KEY_ALIAS") ?: "",
        keyPassword: System.getenv("ANDROID_KEY_PASSWORD") ?: ""]
def anyEnvironmentSigning = environmentSigning.values().any { !it.isEmpty() }
def hasEnvironmentSigning = environmentSigning.values().every { !it.isEmpty() }
if (anyEnvironmentSigning && !hasEnvironmentSigning) {
    throw new GradleException("All Android release signing environment variables must be set together.")
}
if (hasEnvironmentSigning && !file(environmentSigning.path).isFile()) {
    throw new GradleException("ANDROID_KEYSTORE_PATH does not point to a signing file.")
}
def hasReleaseSigning = signingPropertiesFile.exists() || hasEnvironmentSigning

android {
    namespace "com.jellyfinforrayneo.client"
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.jellyfinforrayneo.client"
        minSdk 26
        targetSdk 29
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "android.app.Instrumentation"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile hasEnvironmentSigning
                        ? file(environmentSigning.path)
                        : rootProject.file(signingProperties.getProperty("storeFile"))
                storePassword hasEnvironmentSigning
                        ? environmentSigning.storePassword
                        : signingProperties.getProperty("storePassword")
                keyAlias hasEnvironmentSigning
                        ? environmentSigning.keyAlias
                        : signingProperties.getProperty("keyAlias")
                keyPassword hasEnvironmentSigning
                        ? environmentSigning.keyPassword
                        : signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ["META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register("buildGlassesUi", Exec) {
    workingDir repositoryRoot
    commandLine "npm", "--prefix", "GlassesUI", "run", "build"
    inputs.files(
            fileTree("${repositoryRoot}/GlassesUI/src"),
            fileTree("${repositoryRoot}/GlassesUI/public"),
            file("${repositoryRoot}/GlassesUI/index.html"),
            file("${repositoryRoot}/GlassesUI/package.json"),
            file("${repositoryRoot}/GlassesUI/package-lock.json"),
            file("${repositoryRoot}/GlassesUI/tsconfig.json"),
            file("${repositoryRoot}/GlassesUI/tsconfig.app.json"),
            file("${repositoryRoot}/GlassesUI/tsconfig.node.json"),
            file("${repositoryRoot}/GlassesUI/vite.config.ts"))
    outputs.dir("src/main/assets/GlassesUI")
}

tasks.register("buildCompanionUi", Exec) {
    workingDir repositoryRoot
    commandLine "npm", "--prefix", "CompanionUI", "run", "build"
    inputs.files(
            fileTree("${repositoryRoot}/CompanionUI/src"),
            fileTree("${repositoryRoot}/CompanionUI/public"),
            file("${repositoryRoot}/CompanionUI/index.html"),
            file("${repositoryRoot}/CompanionUI/package.json"),
            file("${repositoryRoot}/CompanionUI/package-lock.json"))
    outputs.dir("src/main/assets/CompanionUI")
}

tasks.register("verifyProductionAssets") {
    dependsOn "buildGlassesUi", "buildCompanionUi"
    doLast {
        def forbidden = fileTree("src/main/assets") {
            include "**/.jellyfin-dev.json", "**/*jellyfin-dev*"
        }.files
        if (!forbidden.isEmpty()) {
            throw new GradleException("Development Jellyfin configuration must not enter APK assets.")
        }
        ["GlassesUI/index.html", "CompanionUI/index.html"].each { relativePath ->
            if (!file("src/main/assets/${relativePath}").isFile()) {
                throw new GradleException("Missing production asset: ${relativePath}")
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn "verifyProductionAssets"
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
