<!doctype html>
<meta charset="utf-8">
<title>tachi ASS renderer regression</title>
<style>
body{background:#0b111b;color:white;font:16px sans-serif;margin:24px}button,input{font:inherit;padding:8px;margin:6px}#stage{position:relative;width:800px;height:500px;background:#162030}video{width:100%;height:100%;object-fit:contain}canvas{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}#status{white-space:pre-line}
</style>
<h1>tachi ASS renderer regression</h1>
<p>Uses the production libass adapter, Source Han Sans, and a synthetic ASS feature fixture.</p>
<label>Subtitle URL <input id="source" value="./fixtures/ass-features.ass" size="45"></label><label>Time <input id="time" type="number" value="1" min="0" step="0.01"></label><button id="seek">Render time</button><br><button id="load">Load ASS</button><button id="one">1 second</button><button id="three">3 seconds</button><button id="five">5 seconds</button><button id="ten">10 seconds</button><button id="play">Play / pause video clock</button><button id="off">Turn off</button>
<div id="stage"><video src="./fixtures/subtitle-clock.mp4" muted playsinline preload="auto"></video><canvas width="640" height="360"></canvas></div>
<p id="status">Idle</p>
<script type="module">
import {createAssRenderer} from '/src/assRenderer.ts'
import {bindAssVideo} from '/src/assVideo.ts'
const canvas=document.querySelector('canvas'),video=document.querySelector('video'),status=document.querySelector('#status')
let renderer,controller,unbind
function stop(){video.pause();unbind?.();controller?.abort();renderer?.dispose();renderer=null;status.textContent='Off'}
async function load(){stop();status.textContent='Loading';controller=new AbortController();try{const source=await fetch(document.querySelector('#source').value).then(r=>r.text());renderer=await createAssRenderer(canvas,source,[],controller.signal,()=>status.textContent='Failed');renderer.resize(640,360);canvas.style.visibility='visible';renderer.render(Number(document.querySelector('#time').value));status.textContent='Loaded · manual clock'}catch{status.textContent='Failed'}}
document.querySelector('#load').onclick=load
document.querySelector('#seek').onclick=()=>{video.pause();unbind?.();unbind=null;canvas.style.visibility='visible';renderer?.render(Number(document.querySelector('#time').value));status.textContent='Manual clock · '+document.querySelector('#time').value+' seconds'}
for(const [id,time] of [['one',1],['three',3],['five',5],['ten',10]])document.querySelector('#'+id).onclick=()=>{video.pause();unbind?.();unbind=null;canvas.style.visibility='visible';renderer?.render(time);status.textContent='Manual clock · '+time+' seconds'}
document.querySelector('#play').onclick=()=>{if(!renderer)return;if(!unbind)unbind=bindAssVideo(video,canvas,renderer);if(video.paused){video.play().then(()=>status.textContent='Video clock playing').catch(()=>status.textContent='Video playback unavailable')}else{video.pause();status.textContent='Video clock paused'}}
document.querySelector('#off').onclick=stop
window.addEventListener('pagehide',stop)
</script>
