name: Signed Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require complete signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
              ANDROID_KEYSTORE_BASE64 \
              ANDROID_KEYSTORE_PASSWORD \
              ANDROID_KEY_ALIAS \
              ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required repository secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            CompanionUI/package-lock.json
            GlassesUI/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android platform and build tools
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Verify release version
        shell: bash
        run: ./scripts/verify-version.sh "${GITHUB_REF_NAME}"

      - name: Restore release signing key
        shell: bash
        run: |
          set -euo pipefail
          signing_file="${RUNNER_TEMP}/rayneo-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${signing_file}"
          chmod 600 "${signing_file}"
          echo "ANDROID_KEYSTORE_PATH=${signing_file}" >> "${GITHUB_ENV}"

      - name: Build release APK
        shell: bash
        run: ./scripts/build-android.sh release

      - name: Verify generated sources and APK signature
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          apk_path="AndroidApp/app/build/outputs/apk/release/app-release.apk"
          test -f "${apk_path}"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "${apk_path}"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset_name="JellyfinForRayneo-${version}-arm64-v8a.apk"
          release_directory="${RUNNER_TEMP}/release"
          mkdir -p "${release_directory}"
          cp AndroidApp/app/build/outputs/apk/release/app-release.apk \
            "${release_directory}/${asset_name}"
          (
            cd "${release_directory}"
            sha256sum "${asset_name}" > "${asset_name}.sha256"
          )
          echo "RELEASE_DIRECTORY=${release_directory}" >> "${GITHUB_ENV}"
          echo "RELEASE_ASSET=${asset_name}" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(
            --verify-tag
            --generate-notes
            --title "Jellyfin for RayNeo ${GITHUB_REF_NAME}"
            --notes "正式签名的 ARM64 APK；安装前可使用随附 SHA-256 文件校验下载。"
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_DIRECTORY}/${RELEASE_ASSET}#Signed ARM64 APK" \
            "${RELEASE_DIRECTORY}/${RELEASE_ASSET}.sha256#SHA-256 checksum" \
            "${release_flags[@]}"
